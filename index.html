<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny & Friends</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}.scene{height:100%;position:relative;background:linear-gradient(#82d8ff 0 62%,#74cf62 62%)}.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffd84d;right:8%;top:7%;box-shadow:0 0 35px #ffe99a}.cloud{position:absolute;width:150px;height:45px;background:white;border-radius:50px;opacity:.9;animation:drift 18s linear infinite}.cloud:before,.cloud:after{content:'';position:absolute;background:white;border-radius:50%}.cloud:before{width:65px;height:65px;left:25px;bottom:10px}.cloud:after{width:80px;height:80px;right:25px;bottom:4px}.c1{top:13%;left:-180px}.c2{top:28%;left:-250px;animation-delay:7s}.hill{position:absolute;bottom:28%;width:65%;height:28%;background:#5fbd58;border-radius:50% 50% 0 0}.h1{left:-15%}.h2{right:-15%;background:#6ac75c}.text{position:absolute;top:7%;left:50%;transform:translateX(-50%);font-size:clamp(26px,5vw,58px);font-weight:900;color:#fff;text-shadow:0 4px #3c7ca5;white-space:nowrap}.character{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:180px;height:240px;animation:bounce 1s ease-in-out infinite}.head{position:absolute;left:20px;top:0;width:140px;height:140px;border-radius:50%;background:#f5b27d;border:5px solid #70412d}.hair{position:absolute;left:18px;top:-12px;width:145px;height:65px;background:#5a3928;border-radius:70% 60% 45% 45%;z-index:2}.eye{position:absolute;top:58px;width:14px;height:20px;border-radius:50%;background:#222}.e1{left:50px}.e2{right:50px}.mouth{position:absolute;left:60px;top:94px;width:35px;height:18px;border-bottom:5px solid #a23e45;border-radius:0 0 40px 40px}.body{position:absolute;left:43px;top:128px;width:95px;height:105px;border-radius:35px 35px 20px 20px;background:#ff6f91}.arm{position:absolute;width:25px;height:75px;background:#f5b27d;border-radius:20px;top:145px}.a1{left:25px;transform:rotate(25deg)}.a2{right:20px;transform:rotate(-25deg)}.leg{position:absolute;width:30px;height:70px;background:#4f72d9;border-radius:20px;bottom:-35px}.l1{left:53px}.l2{right:53px}.lyrics{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:#ffffffe8;padding:14px 24px;border-radius:30px;font-size:clamp(18px,3vw,32px);font-weight:800;color:#315b72;text-align:center;min-width:55%;animation:pulse 2s infinite}.start{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#14324659}button{border:0;border-radius:999px;padding:18px 32px;font-size:24px;font-weight:800;background:white;cursor:pointer;box-shadow:0 8px 20px #0003}.hidden{display:none}@keyframes bounce{50%{transform:translateX(-50%) translateY(-18px)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(125vw)}}</style></head><body><div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill h1"></div><div class="hill h2"></div><div class="text">Sunny & Friends</div><div class="character"><div class="hair"></div><div class="head"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="lyrics" id="lyrics">♪ Clap your hands, one-two-three! ♪</div><div class="start" id="start"><button onclick="startShow()">▶ Play nursery song</button></div></div><script>const lines=['♪ Clap your hands, one-two-three! ♪','♪ Stomp your feet so happily! ♪','♪ Wave hello to the sunny sky! ♪','♪ Jump up high, then touch your toes! ♪','♪ Sunny friends, the fun still grows! ♪'];function startShow(){document.getElementById('start').classList.add('hidden');let i=0;const el=document.getElementById('lyrics');const timer=setInterval(()=>{i++;if(i>=lines.length){clearInterval(timer);el.textContent='★ The End ★';return}el.textContent=lines[i]},3500)}</script></body></html>
