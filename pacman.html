<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pac-Man Browser Game</title>
<style>
:root{--bg:#050714;--maze:#173cff;--yellow:#ffd92f;--text:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#111a47,#050714 65%);color:var(--text);font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.wrap{width:min(760px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.title{font-size:clamp(28px,6vw,48px);font-weight:900;color:var(--yellow);text-shadow:0 0 18px #ffd92f55}.stats{display:flex;gap:14px;font-weight:800;background:#0d1230;padding:9px 14px;border-radius:12px;border:1px solid #27317b}
canvas{width:100%;height:auto;background:#000;border:3px solid #2938ff;border-radius:14px;box-shadow:0 0 35px #1e39ff55;image-rendering:pixelated}.controls{margin-top:12px;color:#aeb8ee;font-size:14px}.controls b{color:#fff}.btn{margin-top:12px;padding:10px 16px;border:0;border-radius:10px;background:var(--yellow);color:#111;font-weight:900;cursor:pointer}.msg{min-height:28px;margin-top:8px;font-weight:800;color:#fff}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="title">PAC-MAN</div><div class="stats"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span></div></div>
<canvas id="game" width="504" height="576"></canvas><div class="msg" id="msg">Press an arrow key to start</div><div class="controls"><b>Arrow keys</b> or <b>WASD</b> to move · Eat all pellets · Avoid the ghosts</div><button class="btn" id="restart">Restart</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),msg=document.getElementById('msg');
const tile=24, cols=21, rows=24;
// 1 wall, 0 pellet path, 2 empty path, 3 power pellet
const layout=[
'111111111111111111111','100000000010000000001','101111011010110111101','103000010000010000301','101110111011101110101','100000000000000000001','101101011111110110101','100001010000010100001','111101011011010110111','200001000000000100002','111101011011010110111','100000010000010000001','101111010111010111101','100000000010000000001','101110111010111110101','103010000000000010301','101011011011011010101','100000010000010000001','101111010111010111101','100000000000000000001','101111011010110111101','100000010000010000001','101111111111111111101','111111111111111111111'];
let map=layout.map(r=>r.split('').map(Number));
const dots=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(map[y][x]===0||map[y][x]===3)dots.push({x,y,power:map[y][x]===3,eaten:false});
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
let pac,ghosts,score=0,lives=3,started=false,gameOver=false,last=0,acc=0;
function resetPositions(){pac={x:10,y:18,px:10,py:18,dir:[0,0],want:[0,0],mouth:0};ghosts=[{x:9,y:11,px:9,py:11,dir:[1,0],c:'#ff4b5c'},{x:10,y:11,px:10,py:11,dir:[-1,0],c:'#47d7ff'},{x:11,y:11,px:11,py:11,dir:[0,-1],c:'#ff8ad8'}]}
function reset(){score=0;lives=3;gameOver=false;started=false;dots.forEach(d=>d.eaten=false);resetPositions();updateUI();msg.textContent='Press an arrow key to start';draw()}
function updateUI(){scoreEl.textContent=score;livesEl.textContent=lives}
function can(nx,ny){return nx>=0&&nx<cols&&ny>=0&&ny<rows&&map[ny][nx]!==1}
function choosePacDir(){const [wx,wy]=pac.want,[dx,dy]=pac.dir;if(can(pac.x+wx,pac.y+wy)){pac.dir=pac.want;return}if(!can(pac.x+dx,pac.y+dy))pac.dir=[0,0]}
function same(a,b){return a[0]===b[0]&&a[1]===b[1]}
function moveEntity(e){let [dx,dy]=e.dir;if(can(e.x+dx,e.y+dy)){e.px=e.x;e.py=e.y;e.x+=dx;e.y+=dy}else{e.dir=randomDir(e)} }
function randomDir(g){let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>can(g.x+d[0],g.y+d[1]));if(!opts.length)return [0,0];let nonReverse=opts.filter(d=>!(d[0]===-g.dir[0]&&d[1]===-g.dir[1]));if(nonReverse.length)opts=nonReverse;return opts[Math.floor(Math.random()*opts.length)]}
function eat(){const d=dots.find(d=>!d.eaten&&d.x===pac.x&&d.y===pac.y);if(d){d.eaten=true;score+=d.power?50:10;updateUI()}if(dots.every(d=>d.eaten)){gameOver=true;msg.textContent='YOU WIN! 🎉 Press Restart to play again';}}
function hit(){for(const g of ghosts)if(g.x===pac.x&&g.y===pac.y){lives--;updateUI();if(lives<=0){gameOver=true;msg.textContent='GAME OVER — Press Restart'}else{msg.textContent='Ouch!';resetPositions()}return}}
function tick(){if(!started||gameOver)return;choosePacDir();moveEntity(pac);eat();if(gameOver)return;for(const g of ghosts){if(Math.random()<0.35)g.dir=randomDir(g);moveEntity(g)}hit()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(map[y][x]===1){ctx.fillStyle='#1237ff';ctx.fillRect(x*tile,y*tile,tile,tile);ctx.strokeStyle='#5f76ff';ctx.strokeRect(x*tile+2,y*tile+2,tile-4,tile-4)}
for(const d of dots)if(!d.eaten){ctx.fillStyle=d.power?'#fff':'#ffe9a6';const r=d.power?5:2.5;ctx.beginPath();ctx.arc(d.x*tile+tile/2,d.y*tile+tile/2,r,0,Math.PI*2);ctx.fill()}
// Pac-Man
const cx=pac.x*tile+tile/2,cy=pac.y*tile+tile/2,ang=Math.atan2(pac.dir[1],pac.dir[0])||0;ctx.fillStyle='#ffd92f';ctx.beginPath();let gap=.35+.22*Math.abs(Math.sin(pac.mouth));ctx.moveTo(cx,cy);ctx.arc(cx,cy,9,ang+gap,ang+Math.PI*2-gap);ctx.closePath();ctx.fill();
for(const g of ghosts){const gx=g.x*tile+tile/2,gy=g.y*tile+tile/2;ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(gx,gy-1,9,Math.PI,0);ctx.lineTo(gx+9,gy+9);ctx.lineTo(gx+4,gy+5);ctx.lineTo(gx,gy+9);ctx.lineTo(gx-4,gy+5);ctx.lineTo(gx-9,gy+9);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx-3,gy-1,3,0,Math.PI*2);ctx.arc(gx+3,gy-1,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a2b70';ctx.beginPath();ctx.arc(gx-3,gy,1.5,0,Math.PI*2);ctx.arc(gx+3,gy,1.5,0,Math.PI*2);ctx.fill()}
}
function loop(t){const dt=Math.min(0.05,(t-last)/1000||0);last=t;acc+=dt;if(acc>0.16){acc=0;tick()}pac.mouth+=dt*10;draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();pac.want=keys[e.key];if(!started&&!gameOver){started=true;msg.textContent=''} }});document.getElementById('restart').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
